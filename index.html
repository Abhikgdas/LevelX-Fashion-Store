<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEVELX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none;
}

body{
    background:black;
    overflow-x:hidden;
    font-family:'Oswald',sans-serif;
    transition:1s ease;
}

/* =========================
   CURSOR
========================= */

.cursor{
    width:18px;
    height:18px;
    border:2px solid white;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999999;
    transition:.15s;
    mix-blend-mode:difference;
}

.cursor-dot{
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999999;
    mix-blend-mode:difference;
}

/* =========================
   NAVBAR
========================= */

nav{
    width:100%;
    padding:28px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    mix-blend-mode:difference;
}

.nav-links{
    display:flex;
    gap:55px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:.8rem;
    letter-spacing:5px;
    text-transform:uppercase;
    position:relative;
}

.nav-links a::after{
    content:'';
    width:0%;
    height:1px;
    background:white;
    position:absolute;
    left:0;
    bottom:-6px;
    transition:.5s;
}

.nav-links a:hover::after{
    width:100%;
}

/* =========================
   LOGO
========================= */

.logo{
    position:relative;
    color:white;
    font-size:3rem;
    font-weight:700;
    letter-spacing:4px;
}

.logo span{
    color:#ff2e63;
    position:absolute;
    right:-22px;
    top:-3px;
    transform:rotate(-12deg);
    transition:.5s;
}

.logo:hover span{
    transform:rotate(12deg) scale(1.2);
}

/* =========================
   HERO
========================= */

.hero{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    transition:1s ease;
}

/* BACKGROUND WORDS */

.bg-text{
    position:absolute;
    font-size:12vw;
    color:rgba(255,255,255,.04);
    z-index:1;
    line-height:.9;
    text-transform:uppercase;
    pointer-events:none;
}

.bg1{
    top:12%;
}

.bg2{
    top:40%;
}

.bg3{
    top:68%;
}

/* MAIN TEXT */

.text-wrapper{
    position:relative;
    z-index:5;
}

.video-text{
    position:relative;
    font-size:13vw;
    line-height:.88;
    text-transform:uppercase;
    font-weight:700;
    color:white;
    overflow:hidden;
    cursor:pointer;
}



/* FLOAT VIDEO */

.follow-video{
    position:fixed;
    width:320px;
    height:200px;
    overflow:hidden;
    pointer-events:none;
    z-index:999;

    border-radius:12px;

    opacity:0;

    transform:
    perspective(1000px)
    rotateX(0deg)
    rotateY(0deg)
    scale(.7);

    transition:
    opacity .3s ease,
    transform .15s ease-out;

    will-change:transform;

    box-shadow:
    0 30px 80px rgba(0,0,0,.45);

}

.follow-video video{
    width:100%;
    height:100%;
    object-fit:contain;
}
.follow-video::after{
    content:'';

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    120deg,
    rgba(255,255,255,.12),
    transparent 40%
    );

    pointer-events:none;
}

/* =========================
   SCROLL SECTION
========================= */

.scroll-section{
    height:500vh;
    position:relative;
    background:#f1f1f1;
}

.sticky{
    width:100%;
    height:100vh;
    position:sticky;
    top:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* HUGE TEXT */

.zoom-text{
    position:absolute;
    font-size:30vw;
    line-height:.8;
    font-weight:700;
    text-transform:uppercase;
    z-index:3;
    color:transparent;

    background:url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1600&auto=format&fit=crop')
    center/cover;

    -webkit-background-clip:text;
    background-clip:text;
    pointer-events:none;
}

/* VIDEO OVERLAY */

.zoom-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:.4;
}

/* SCROLL TEXT */

.scroll{
    position:absolute;
    bottom:0px;
    left:50%;
    transform:translateX(-50%) translateY(40px);

    color:white;
    letter-spacing:5px;
    font-size:.8rem;
    z-index:9999;

    animation:bounce 2s infinite;
    mix-blend-mode:difference;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(40px);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

    .video-text{
        font-size:18vw;
    }

    .zoom-text{
        font-size:40vw;
    }

    nav{
        padding:25px;
    }

    .nav-links{
        display:none;
    }

}
.hover-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    top:0;
    left:0;
    opacity:0;
    transition:.25s ease;
}

.hover-video.active{
    opacity:1;
}

/* =========================
   COLLECTION SECTION
========================= */

.collection-section{
    background:#0a0a0a;
    padding:120px 70px 140px;
}

.collection-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:80px;
    border-bottom:1px solid rgba(255,255,255,.08);
    padding-bottom:40px;
}

.collection-title{
    font-size:5rem;
    font-weight:700;
    color:white;
    letter-spacing:2px;
    text-transform:uppercase;
    line-height:.9;
}

.collection-title span{
    color:#ff2e63;
}

.collection-subtitle{
    color:rgba(255,255,255,.35);
    font-size:.75rem;
    letter-spacing:5px;
    text-transform:uppercase;
    text-align:right;
}

.collection-count{
    font-size:4rem;
    font-weight:700;
    color:rgba(255,255,255,.06);
    line-height:1;
}

/* GRID */

.collection-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
}

.product-card{
    position:relative;
    background:#111;
    overflow:hidden;
    cursor:pointer;
}

.product-card:nth-child(5n+1){ grid-column:span 1; }

.product-img-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#f5f5f5;
    padding:20px;
}

.product-card:nth-child(5n+1) .product-img-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#f5f5f5;
    padding:20px;
}

.product-img-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    transition:.7s cubic-bezier(.25,.46,.45,.94);
    display:block;
}

.product-card:hover .product-img-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
    transition:.7s cubic-bezier(.25,.46,.45,.94);
    display:block;
}

/* PRODUCT TAG */

.product-tag{
    position:absolute;
    top:16px;
    left:16px;
    background:#ff2e63;
    color:white;
    font-size:.6rem;
    letter-spacing:4px;
    text-transform:uppercase;
    padding:5px 10px;
    z-index:2;
}

.product-tag.new{
    background:#ff2e63;
}

.product-tag.sold{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
}

/* QUICK BUY OVERLAY */

.product-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:24px;
    opacity:0;
    transition:.3s ease;
    z-index:3;
}

.product-card:hover .product-overlay{
    opacity:1;
}

.btn-add-cart{
    width:100%;
    background:#ff2e63;
    color:white;
    border:none;
    padding:14px 0;
    font-family:'Oswald',sans-serif;
    font-size:.75rem;
    letter-spacing:5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.btn-add-cart::before{
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:100%;height:100%;
    background:rgba(255,255,255,.15);
    transition:.3s;
}

.btn-add-cart:hover::before{
    left:100%;
}

.btn-buy-now{
    width:100%;
    background:transparent;
    color:white;
    border:1px solid rgba(255,255,255,.4);
    padding:12px 0;
    font-family:'Oswald',sans-serif;
    font-size:.75rem;
    letter-spacing:5px;
    text-transform:uppercase;
    cursor:pointer;
    margin-top:8px;
    transition:.2s;
}

.btn-buy-now:hover{
    background:white;
    color:black;
    border-color:white;
}

/* PRODUCT INFO */

.product-info{
    padding:18px 20px 22px;
    border-top:1px solid rgba(255,255,255,.05);
}

.product-name{
    color:white;
    font-size:.85rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:500;
}

.product-price-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.product-price{
    color:#ff2e63;
    font-size:1.1rem;
    font-weight:600;
    letter-spacing:1px;
}

.product-price-old{
    color:rgba(255,255,255,.25);
    font-size:.8rem;
    text-decoration:line-through;
    letter-spacing:1px;
}

.product-color{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.color-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
}

/* ADDED FLASH */

.added-flash{
    position:absolute;
    inset:0;
    background:#ff2e63;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:.75rem;
    letter-spacing:5px;
    text-transform:uppercase;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.added-flash.show{
    opacity:1;
    pointer-events:none;
}

/* =========================
   CART SIDEBAR
========================= */

.cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:99998;
    opacity:0;
    pointer-events:none;
    transition:.35s ease;
    backdrop-filter:blur(4px);
}

.cart-overlay.open{
    opacity:1;
    pointer-events:all;
}

.cart-sidebar{
    position:fixed;
    right:-520px;
    top:0;
    width:480px;
    height:100vh;
    background:#0d0d0d;
    z-index:99999;
    display:flex;
    flex-direction:column;
    transition:.45s cubic-bezier(.77,0,.18,1);
    border-left:1px solid rgba(255,255,255,.07);
}

.cart-sidebar.open{
    right:0;
}

.cart-header{
    padding:32px 36px 24px;
    border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
}

.cart-title{
    color:white;
    font-size:1.1rem;
    letter-spacing:6px;
    text-transform:uppercase;
    font-weight:600;
}

.cart-title-count{
    color:#ff2e63;
    font-size:1rem;
    margin-left:8px;
}

.cart-close{
    background:none;
    border:1px solid rgba(255,255,255,.15);
    color:white;
    width:38px;
    height:38px;
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
    flex-shrink:0;
}

.cart-close:hover{
    background:white;
    color:black;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:24px 36px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,46,99,.3) transparent;
}

.cart-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    color:rgba(255,255,255,.2);
    gap:16px;
}

.cart-empty-icon{
    font-size:3rem;
    opacity:.3;
}

.cart-empty-text{
    font-size:.75rem;
    letter-spacing:5px;
    text-transform:uppercase;
}

.cart-item{
    display:flex;
    gap:18px;
    padding:20px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    animation:slideIn .3s ease;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.cart-item-img{
    width:80px;
    height:100px;
    object-fit:contain;
    flex-shrink:0;
    background:#1a1a1a;
}

.cart-item-details{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.cart-item-name{
    color:white;
    font-size:.78rem;
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:500;
    line-height:1.4;
}

.cart-item-price{
    color:#ff2e63;
    font-size:1rem;
    font-weight:600;
    letter-spacing:1px;
}

.cart-item-qty-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.qty-btn{
    background:rgba(255,255,255,.08);
    border:none;
    color:white;
    width:26px;
    height:26px;
    cursor:pointer;
    font-size:.9rem;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald',sans-serif;
}

.qty-btn:hover{
    background:#ff2e63;
}

.qty-num{
    color:white;
    font-size:.8rem;
    min-width:16px;
    text-align:center;
    letter-spacing:1px;
}

.cart-item-remove{
    background:none;
    border:none;
    color:rgba(255,255,255,.25);
    cursor:pointer;
    font-size:.7rem;
    letter-spacing:3px;
    text-transform:uppercase;
    transition:.2s;
    padding:0;
    font-family:'Oswald',sans-serif;
    align-self:flex-start;
}

.cart-item-remove:hover{
    color:#ff2e63;
}

/* CART FOOTER */

.cart-footer{
    padding:24px 36px 36px;
    border-top:1px solid rgba(255,255,255,.07);
    flex-shrink:0;
}

.cart-subtotal{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.cart-subtotal-label{
    color:rgba(255,255,255,.4);
    font-size:.7rem;
    letter-spacing:5px;
    text-transform:uppercase;
}

.cart-subtotal-value{
    color:white;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:1px;
}

.cart-note{
    color:rgba(255,255,255,.2);
    font-size:.65rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.btn-checkout{
    width:100%;
    background:#ff2e63;
    color:white;
    border:none;
    padding:17px 0;
    font-family:'Oswald',sans-serif;
    font-size:.8rem;
    letter-spacing:6px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.btn-checkout::before{
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:100%;height:100%;
    background:rgba(255,255,255,.12);
    transition:.3s;
}

.btn-checkout:hover::before{
    left:100%;
}

/* CART TRIGGER BUTTON */

.cart-trigger{
    position:fixed;
    top:50%;
    right:0;
    transform:translateY(-50%);
    background:#ff2e63;
    color:white;
    border:none;
    padding:16px 10px;
    cursor:pointer;
    z-index:9997;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transition:.2s;
    font-family:'Oswald',sans-serif;
}

.cart-trigger:hover{
    padding-right:18px;
    background:#e0284f;
}

.cart-trigger-icon{
    font-size:1.1rem;
}

.cart-trigger-label{
    font-size:.55rem;
    letter-spacing:3px;
    text-transform:uppercase;
    writing-mode:vertical-rl;
    text-orientation:mixed;
}

.cart-badge{
    background:white;
    color:#ff2e63;
    border-radius:50%;
    width:20px;
    height:20px;
    font-size:.65rem;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* RESPONSIVE COLLECTION */

@media(max-width:900px){

    .collection-section{
        padding:80px 20px 100px;
    }

    .collection-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-card:nth-child(5n+1){ grid-column:span 1; }

    .collection-title{
        font-size:3rem;
    }

    .cart-sidebar{
        width:100vw;
        right:-100vw;
    }

    .cart-trigger{
        top:auto;
        bottom:24px;
        right:24px;
        transform:none;
        border-radius:50%;
        width:56px;
        height:56px;
        padding:0;
        flex-direction:row;
        justify-content:center;
    }

    .cart-trigger-label{
        display:none;
    }

}


</style>

</head>

<body>

<!-- =========================
     CURSOR
========================= -->

<div class="cursor"></div>
<div class="cursor-dot"></div>

<!-- =========================
     FLOAT VIDEO
========================= -->

    <div class="follow-video">

        <video autoplay muted loop playsinline
        class="hover-video active"
        id="wearVid">

            <source src="english.mp4" type="video/mp4">

        </video>

        <video autoplay muted loop playsinline
        class="hover-video"
        id="futureVid">

            <source src="dulquer.mp4" type="video/mp4">

        </video>

    </div>

<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="nav-links">
        <a href="#">About</a>
        <a href="#collection">Collection</a>
    </div>

    <div class="logo">
        LEVEL<span>X</span>
    </div>

    <div class="nav-links">
        <a href="#">Lookbook</a>
        <a href="#">Contact</a>
    </div>

</nav>

<!-- =========================
     HERO
========================= -->

<section class="hero" id="hero">

    <!-- BACKGROUND WORDS -->

    <h1 class="bg-text bg1">
        Wear
    </h1>

    <h1 class="bg-text bg2">

    </h1>

    <h1 class="bg-text bg3">

    </h1>

    <!-- MAIN TEXT -->

    <div class="text-wrapper">

            <!-- WEAR -->

            <div class="video-text"
            data-video="english.mp4"

                WEAR

            </div>

            <!-- THE -->

            <div class="video-text"

                THE

            </div>

            <!-- FUTURE -->

            <div class="video-text"
            data-video="dulquer.mp4"
            data-bg="#561C24">

                FUTURE

            </div>

    <div class="scroll">
        SCROLL
    </div>

</section>

<!-- =========================
     SCROLL ZOOM SECTION
========================= -->

<section class="scroll-section">

    <div class="sticky">

        

        <h1 class="zoom-text">
            LEVELX
        </h1>

    </div>

</section>

-- =========================
     CART TRIGGER
========================= -->

<button class="cart-trigger" id="cartTrigger">
    <span class="cart-trigger-icon">🛍</span>
    <span class="cart-badge" id="cartBadge">0</span>
    <span class="cart-trigger-label">Cart</span>
</button>

<!-- =========================
     CART OVERLAY + SIDEBAR
========================= -->

<div class="cart-overlay" id="cartOverlay"></div>

<div class="cart-sidebar" id="cartSidebar">

    <div class="cart-header">
        <div>
            <span class="cart-title">YOUR CART</span>
            <span class="cart-title-count" id="cartCount"></span>
        </div>
        <button class="cart-close" id="cartClose">✕</button>
    </div>

    <div class="cart-items" id="cartItems">
        <div class="cart-empty" id="cartEmpty">
            <div class="cart-empty-icon">🛍</div>
            <div class="cart-empty-text">Your cart is empty</div>

    </div>

    <div class="cart-footer">
        <div class="cart-subtotal">
            <span class="cart-subtotal-label">Subtotal</span>
            <span class="cart-subtotal-value" id="cartTotal">₹0</span>
        </div>
        <div class="cart-note">Taxes &amp; shipping calculated at checkout</div>
        <button class="btn-checkout">Proceed to Checkout →</button>
    </div>

</div>

<!-- =========================
     COLLECTION SECTION
========================= -->

<section class="collection-section" id="collection">

    <div class="collection-header">
        <div>
            <h2 class="collection-title">THE<br><span>COLLECTION</span></h2>
        </div>
        <div style="text-align:right">
            <div class="collection-count">20</div>
            <div class="collection-subtitle">Pieces · SS 2025</div>
        </div>
    </div>

    <div class="collection-grid" id="collectionGrid">
        <!-- JS GENERATED -->
    </div>

</section>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

// =========================
// CUSTOM CURSOR
// =========================

const cursor =
document.querySelector(".cursor");

const dot =
document.querySelector(".cursor-dot");

window.addEventListener("mousemove",(e)=>{

    cursor.style.left =
    e.clientX + "px";

    cursor.style.top =
    e.clientY + "px";

    dot.style.left =
    e.clientX + "px";

    dot.style.top =
    e.clientY + "px";

});

// =========================
// PRELOAD VIDEOS
// =========================

const videoSources = {
    wear: "english.mp4",
    the: "fashion.mp4",
    future: "dulquer.mp4"
};

Object.values(videoSources).forEach(src=>{

    const video = document.createElement("video");

    video.src = src;

    video.preload = "auto";

});

// =========================
// VIDEO FOLLOW CURSOR
// =========================
const texts =
document.querySelectorAll(".video-text");

const followVideo =
document.querySelector(".follow-video");

const hero =
document.getElementById("hero");

const wearVid =
document.getElementById("wearVid");

const theVid =
document.getElementById("theVid");

const futureVid =
document.getElementById("futureVid");

function hideAllVideos(){

    wearVid.classList.remove("active");

    theVid.classList.remove("active");

    futureVid.classList.remove("active");

}

texts.forEach(text=>{

    text.addEventListener("mouseenter",()=>{

        followVideo.style.opacity = "1";

        followVideo.style.transform =
        "scale(1)";

        hero.style.background =
        text.dataset.bg;

        cursor.style.width = "70px";

        cursor.style.height = "70px";

        const current =
        text.innerText.trim().toLowerCase();

        hideAllVideos();

        if(current === "wear"){

            wearVid.classList.add("active");

        }

        else if(current === "the"){

            theVid.classList.add("active");

        }

        else if(current === "future"){

            futureVid.classList.add("active");

        }

    });

    text.addEventListener("mouseleave",()=>{

        followVideo.style.opacity = "0";

        followVideo.style.transform =
        "scale(.7)";

        hero.style.background = "#111";

        cursor.style.width = "18px";

        cursor.style.height = "18px";

    });

    text.addEventListener("mousemove",(e)=>{
// POSITION

        followVideo.style.left =
        e.clientX - 160 + "px";

        followVideo.style.top =
        e.clientY - 100 + "px";

        // TILT EFFECT

        const rotateX =
        (window.innerHeight / 2 - e.clientY) / 10;

        const rotateY =
        (e.clientX - window.innerWidth / 2) / 8;

        followVideo.style.transform = `
        perspective(1000px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale(1)
        `;

    });

});

// =========================
// SMOOTH LEVELX SCROLL ZOOM
// =========================

const zoomText =
document.querySelector(".zoom-text");

window.addEventListener("scroll",()=>{

    let scrollY =
    window.scrollY;

    // SLOWER SCALE

    let scale =
    1 + scrollY * 0.0045;

    zoomText.style.transform =
    `scale(${scale})`;

});


// =========================
// COLLECTION DATA
// =========================


const dresses = [
{id:1,name:"Corduroy Barrel Pants",price:2490,oldPrice:2990,tag:"NEW",colors:["#6b4f3a"],img:"p1.png"},
{id:2,name:"Wide Leg Denim",price:2290,oldPrice:null,tag:"HOT",colors:["#4b6ea8"],img:"p2.png"},
{id:3,name:"Black Wide Denim",price:2390,oldPrice:null,tag:"NEW",colors:["#222"],img:"p3.png"},
{id:4,name:"Linen Relaxed Pants",price:1990,oldPrice:null,tag:null,colors:["#f1ede4"],img:"p4.png"},
{id:5,name:"Tailored Wide Trousers",price:2690,oldPrice:3190,tag:"SALE",colors:["#5a4a43"],img:"p5.png"},
{id:6,name:"Premium Trousers",price:2790,oldPrice:null,tag:"NEW",colors:["#5a4a43"],img:"pants.png"},
{id:7,name:"Striped Casual Shirt",price:1590,oldPrice:null,tag:"NEW",colors:["#d8d6cf"],img:"s1.png"},
{id:8,name:"Mint Linen Shirt",price:1690,oldPrice:null,tag:null,colors:["#dcefe7"],img:"s2.png"},
{id:9,name:"Knit Polo",price:1890,oldPrice:null,tag:"HOT",colors:["#2f4350"],img:"s3.png"},
{id:10,name:"Striped Half Zip",price:2190,oldPrice:null,tag:"NEW",colors:["#f5f5f0","#1f5a49"],img:"s4.png"},
{id:11,name:"Textured Resort Shirt",price:1790,oldPrice:null,tag:"SALE",colors:["#6a2b2b"],img:"s5.png"},
{id:12,name:"Classic White Shirt",price:1490,oldPrice:null,tag:null,colors:["#fff"],img:"shirt.png"}
];


// =========================
// RENDER COLLECTION
// =========================

const grid = document.getElementById("collectionGrid");

dresses.forEach(d=>{

    const tagHTML = d.tag
        ? `<span class="product-tag ${d.tag==='SOLD OUT'?'sold':'new'}">${d.tag}</span>`
        : '';

    const oldPriceHTML = d.oldPrice
        ? `<span class="product-price-old">₹${d.oldPrice.toLocaleString()}</span>`
        : '';

    const colorsHTML = d.colors.map(c=>
        `<div class="color-dot" style="background:${c}"></div>`
    ).join('');

    grid.innerHTML += `
    <div class="product-card" data-id="${d.id}">

        <div class="product-img-wrap">

            ${tagHTML}

            <img
            src="${d.img}"
            alt="${d.name}"
            loading="lazy">

            <div class="product-overlay">

                <button
                class="btn-add-cart"
                onclick="addToCart(${d.id},event)">
                    + Add to Cart
                </button>

                <button
                class="btn-buy-now"
                onclick="addToCart(${d.id},event,true)">
                    Buy Now
                </button>

            </div>

            <div class="added-flash" id="flash-${d.id}">
                ✓ Added
            </div>

        </div>

        <div class="product-info">

            <div class="product-name">${d.name}</div>

            <div class="product-price-row">
                <span class="product-price">₹${d.price.toLocaleString()}</span>
                ${oldPriceHTML}
            </div>

            <div class="product-color">${colorsHTML}</div>

        </div>

    </div>`;

});

// =========================
// CART STATE
// =========================

let cart = [];

function addToCart(id, e, buyNow=false){

    e.stopPropagation();

    const dress = dresses.find(d=>d.id===id);
    const existing = cart.find(i=>i.id===id);

    if(existing){
        existing.qty++;
    } else {
        cart.push({...dress, qty:1});
    }

    updateCart();
    flashAdded(id);

    if(buyNow) openCart();
}

function flashAdded(id){
    const fl = document.getElementById(`flash-${id}`);
    if(!fl) return;
    fl.classList.add("show");
    setTimeout(()=>fl.classList.remove("show"),900);
}

function removeFromCart(id){
    cart = cart.filter(i=>i.id!==id);
    updateCart();
    renderCartItems();
}

function changeQty(id, delta){
    const item = cart.find(i=>i.id===id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0){
        cart = cart.filter(i=>i.id!==id);
    }
    updateCart();
    renderCartItems();
}

function updateCart(){
    const total = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById("cartBadge").textContent = total;
    document.getElementById("cartCount").textContent =
        total > 0 ? `(${total})` : '';
    const sum = cart.reduce((s,i)=>s+(i.price*i.qty),0);
    document.getElementById("cartTotal").textContent =
        `₹${sum.toLocaleString()}`;
    renderCartItems();
}

function renderCartItems(){

    const wrap = document.getElementById("cartItems");
    const empty = document.getElementById("cartEmpty");

    if(cart.length === 0){
        wrap.innerHTML = '';
        wrap.appendChild(empty);
        return;
    }

    wrap.innerHTML = cart.map(item=>`

        <div class="cart-item">

            <img
            class="cart-item-img"
            src="${item.img}"
            alt="${item.name}">

            <div class="cart-item-details">

                <div class="cart-item-name">${item.name}</div>

                <div class="cart-item-qty-row">

                    <button
                    class="qty-btn"
                    onclick="changeQty(${item.id},-1)">−</button>

                    <span class="qty-num">${item.qty}</span>

                    <button
                    class="qty-btn"
                    onclick="changeQty(${item.id},1)">+</button>

                </div>

                <div class="cart-item-price">
                    ₹${(item.price * item.qty).toLocaleString()}
                </div>

                <button
                class="cart-item-remove"
                onclick="removeFromCart(${item.id})">
                    Remove
                </button>

            </div>

        </div>

    `).join('');
}

// =========================
// CART OPEN / CLOSE
// =========================

function openCart(){
    document.getElementById("cartSidebar").classList.add("open");
    document.getElementById("cartOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeCart(){
    document.getElementById("cartSidebar").classList.remove("open");
    document.getElementById("cartOverlay").classList.remove("open");
    document.body.style.overflow = "";
}

document.getElementById("cartTrigger")
    .addEventListener("click", openCart);

document.getElementById("cartClose")
    .addEventListener("click", closeCart);

document.getElementById("cartOverlay")
    .addEventListener("click", closeCart);



document.querySelectorAll('a[href^="#"]').forEach(anchor => {

    anchor.addEventListener('click', function(e) {

        e.preventDefault();

        const target =
        document.querySelector(this.getAttribute('href'));

        target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });

    });

});

</script>

</body>
</html>
