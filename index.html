<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEVELX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none;
}

body{
    background:black;
    overflow-x:hidden;
    font-family:'Oswald',sans-serif;
    transition:1s ease;
}

/* =========================
   CURSOR
========================= */

.cursor{
    width:18px;
    height:18px;
    border:2px solid white;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999999;
    transition:.15s;
    mix-blend-mode:difference;
}

.cursor-dot{
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999999;
    mix-blend-mode:difference;
}

/* =========================
   NAVBAR
========================= */

nav{
    width:100%;
    padding:28px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    mix-blend-mode:difference;
}

.nav-links{
    display:flex;
    gap:55px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:.8rem;
    letter-spacing:5px;
    text-transform:uppercase;
    position:relative;
}

.nav-links a::after{
    content:'';
    width:0%;
    height:1px;
    background:white;
    position:absolute;
    left:0;
    bottom:-6px;
    transition:.5s;
}

.nav-links a:hover::after{
    width:100%;
}

/* =========================
   LOGO
========================= */

.logo{
    position:relative;
    color:white;
    font-size:3rem;
    font-weight:700;
    letter-spacing:4px;
}

.logo span{
    color:#ff2e63;
    position:absolute;
    right:-22px;
    top:-3px;
    transform:rotate(-12deg);
    transition:.5s;
}

.logo:hover span{
    transform:rotate(12deg) scale(1.2);
}

/* =========================
   HERO
========================= */

.hero{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    transition:1s ease;
}

/* BACKGROUND WORDS */

.bg-text{
    position:absolute;
    font-size:12vw;
    color:rgba(255,255,255,.04);
    z-index:1;
    line-height:.9;
    text-transform:uppercase;
    pointer-events:none;
}

.bg1{
    top:12%;
}

.bg2{
    top:40%;
}

.bg3{
    top:68%;
}

/* MAIN TEXT */

.text-wrapper{
    position:relative;
    z-index:5;
}

.video-text{
    position:relative;
    font-size:13vw;
    line-height:.88;
    text-transform:uppercase;
    font-weight:700;
    color:white;
    overflow:hidden;
    cursor:pointer;
}



/* FLOAT VIDEO */

.follow-video{
    position:fixed;
    width:320px;
    height:200px;
    overflow:hidden;
    pointer-events:none;
    z-index:999;

    border-radius:12px;

    opacity:0;

    transform:
    perspective(1000px)
    rotateX(0deg)
    rotateY(0deg)
    scale(.7);

    transition:
    opacity .3s ease,
    transform .15s ease-out;

    will-change:transform;

    box-shadow:
    0 30px 80px rgba(0,0,0,.45);

}

.follow-video video{
    width:100%;
    height:100%;
    object-fit:cover;
}
.follow-video::after{
    content:'';

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    120deg,
    rgba(255,255,255,.12),
    transparent 40%
    );

    pointer-events:none;
}

/* =========================
   SCROLL SECTION
========================= */

.scroll-section{
    height:500vh;
    position:relative;
    background:#f1f1f1;
}

.sticky{
    width:100%;
    height:100vh;
    position:sticky;
    top:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* HUGE TEXT */

.zoom-text{
    position:absolute;
    font-size:30vw;
    line-height:.8;
    font-weight:700;
    text-transform:uppercase;
    z-index:3;
    color:transparent;

    background:url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1600&auto=format&fit=crop')
    center/cover;

    -webkit-background-clip:text;
    background-clip:text;
    pointer-events:none;
}

/* VIDEO OVERLAY */

.zoom-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.4;
}

/* SCROLL TEXT */

.scroll{
    position:absolute;
    bottom:0px;
    left:50%;
    transform:translateX(-50%) translateY(40px);

    color:white;
    letter-spacing:5px;
    font-size:.8rem;
    z-index:9999;

    animation:bounce 2s infinite;
    mix-blend-mode:difference;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(40px);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

    .video-text{
        font-size:18vw;
    }

    .zoom-text{
        font-size:40vw;
    }

    nav{
        padding:25px;
    }

    .nav-links{
        display:none;
    }

}
.hover-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    top:0;
    left:0;
    opacity:0;
    transition:.25s ease;
}

.hover-video.active{
    opacity:1;
}

</style>

</head>

<body>

<!-- =========================
     CURSOR
========================= -->

<div class="cursor"></div>
<div class="cursor-dot"></div>

<!-- =========================
     FLOAT VIDEO
========================= -->

    <div class="follow-video">

        <video autoplay muted loop playsinline
        class="hover-video active"
        id="wearVid">

            <source src="english.mp4" type="video/mp4">

        </video>

        <video autoplay muted loop playsinline
        class="hover-video"
        id="theVid">

            <source src="fashion.mp4" type="video/mp4">

        </video>

        <video autoplay muted loop playsinline
        class="hover-video"
        id="futureVid">

            <source src="dulquer.mp4" type="video/mp4">

        </video>

    </div>

<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="nav-links">
        <a href="#">About</a>
        <a href="#">Collection</a>
    </div>

    <div class="logo">
        LEVEL<span>X</span>
    </div>

    <div class="nav-links">
        <a href="#">Lookbook</a>
        <a href="#">Contact</a>
    </div>

</nav>

<!-- =========================
     HERO
========================= -->

<section class="hero" id="hero">

    <!-- BACKGROUND WORDS -->

    <h1 class="bg-text bg1">
        Wear
    </h1>

    <h1 class="bg-text bg2">
        The
    </h1>

    <h1 class="bg-text bg3">
        Future
    </h1>

    <!-- MAIN TEXT -->

    <div class="text-wrapper">

            <!-- WEAR -->

            <div class="video-text"
            data-video="english.mp4"
            data-bg="#6f5cff">

                WEAR

            </div>

            <!-- THE -->

            <div class="video-text"
            data-video="fashion.mp4"
            data-bg="#111111">

                THE

            </div>

            <!-- FUTURE -->

            <div class="video-text"
            data-video="dulquer.mp4"
            data-bg="#561C24">

                FUTURE

            </div>

    <div class="scroll">
        SCROLL
    </div>

</section>

<!-- =========================
     SCROLL ZOOM SECTION
========================= -->

<section class="scroll-section">

    <div class="sticky">

        

        <h1 class="zoom-text">
            LEVELX
        </h1>

    </div>

</section>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

// =========================
// CUSTOM CURSOR
// =========================

const cursor =
document.querySelector(".cursor");

const dot =
document.querySelector(".cursor-dot");

window.addEventListener("mousemove",(e)=>{

    cursor.style.left =
    e.clientX + "px";

    cursor.style.top =
    e.clientY + "px";

    dot.style.left =
    e.clientX + "px";

    dot.style.top =
    e.clientY + "px";

});

// =========================
// PRELOAD VIDEOS
// =========================

const videoSources = {
    wear: "english.mp4",
    the: "fashion.mp4",
    future: "dulquer.mp4"
};

Object.values(videoSources).forEach(src=>{

    const video = document.createElement("video");

    video.src = src;

    video.preload = "auto";

});

// =========================
// VIDEO FOLLOW CURSOR
// =========================
const texts =
document.querySelectorAll(".video-text");

const followVideo =
document.querySelector(".follow-video");

const hero =
document.getElementById("hero");

const wearVid =
document.getElementById("wearVid");

const theVid =
document.getElementById("theVid");

const futureVid =
document.getElementById("futureVid");

function hideAllVideos(){

    wearVid.classList.remove("active");

    theVid.classList.remove("active");

    futureVid.classList.remove("active");

}

texts.forEach(text=>{

    text.addEventListener("mouseenter",()=>{

        followVideo.style.opacity = "1";

        followVideo.style.transform =
        "scale(1)";

        hero.style.background =
        text.dataset.bg;

        cursor.style.width = "70px";

        cursor.style.height = "70px";

        const current =
        text.innerText.trim().toLowerCase();

        hideAllVideos();

        if(current === "wear"){

            wearVid.classList.add("active");

        }

        else if(current === "the"){

            theVid.classList.add("active");

        }

        else if(current === "future"){

            futureVid.classList.add("active");

        }

    });

    text.addEventListener("mouseleave",()=>{

        followVideo.style.opacity = "0";

        followVideo.style.transform =
        "scale(.7)";

        hero.style.background = "#111";

        cursor.style.width = "18px";

        cursor.style.height = "18px";

    });

    text.addEventListener("mousemove",(e)=>{
// POSITION

        followVideo.style.left =
        e.clientX - 160 + "px";

        followVideo.style.top =
        e.clientY - 100 + "px";

        // TILT EFFECT

        const rotateX =
        (window.innerHeight / 2 - e.clientY) / 10;

        const rotateY =
        (e.clientX - window.innerWidth / 2) / 8;

        followVideo.style.transform = `
        perspective(1000px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale(1)
        `;

    });

});

// =========================
// SMOOTH LEVELX SCROLL ZOOM
// =========================

const zoomText =
document.querySelector(".zoom-text");

window.addEventListener("scroll",()=>{

    let scrollY =
    window.scrollY;

    // SLOWER SCALE

    let scale =
    1 + scrollY * 0.00045;

    zoomText.style.transform =
    `scale(${scale})`;

});

</script>

</body>
</html>
